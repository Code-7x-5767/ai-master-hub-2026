<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Master Hub</title>

<meta name="description" content="Latest AI News, ChatGPT Updates, AI Tools, Tutorials and Technology News.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
padding:25px;
background:#111827;
text-align:center;
}

header h1{
font-size:35px;
}

header p{
margin-top:10px;
color:#bdbdbd;
}

.container{
width:95%;
max-width:1200px;
margin:auto;
padding:30px 0;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
background:#1e293b;
border-radius:15px;
padding:20px;
transition:.3s;
cursor:pointer;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
border-radius:10px;
}

.card h2{
margin-top:15px;
font-size:22px;
}

.card p{
margin-top:10px;
color:#cbd5e1;
}

footer{
padding:25px;
text-align:center;
background:#111827;
margin-top:40px;
}

</style>

</head>

<body>

<header>

<h1>AI MASTER HUB</h1>

<p>Latest AI News • ChatGPT • Technology • AI Tools</p>

</header>

<div class="container">

<div class="card">

<img src="https://picsum.photos/600/400?random=1">

<h2>Latest AI News</h2>

<p>Daily AI news will appear here.</p>

</div>

<div class="card">

<img src="https://picsum.photos/600/400?random=2">

<h2>Best AI Tools</h2>

<p>Top AI tools for creators and businesses.</p>

</div>

<div class="card">

<img src="https://picsum.photos/600/400?random=3">

<h2>ChatGPT Tips</h2>

<p>Learn powerful ChatGPT prompts daily.</p>

</div>

</div>

<footer>

© 2026 AI Master Hub

</footer>

</body>
</html>
